name: AI Developer

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'ai-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    concurrency:
      group: ai-issue-${{ github.event.issue.number }}
      cancel-in-progress: false

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            Implement GitHub Issue #${{ github.event.issue.number }}
            in repository ${{ github.repository }}.

            1. Read the issue and AGENTS.md.
            2. Understand the existing architecture.
            3. Implement the requested changes.
            4. Add relevant tests.
            5. Run available checks.
            6. Create a draft pull request linked to the issue.

            If requirements are unclear, report the
            blocker instead of guessing.

            Never modify production credentials.

          claude_args: |
            --max-turns 30
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash,Skill"
