appId: com.nomady.app
name: Sign-up at end of funnel reaches paywall, account can be deleted from there
tags:
  - reverse-funnel
  - sign-up
env:
  TEST_EMAIL: "maestro-${MAESTRO_RUN_ID:-local}@example.com"
  TEST_PASSWORD: "testpw1234"
---
- clearState
- clearKeychain
- launchApp
- runFlow: 00-dismiss-system-dialogs.yaml
# The notification prompt can come up over the welcome screen.
- extendedWaitUntil: {visible: "(Get started|Nicht erlauben|Don.t Allow)", timeout: 60000}
- tapOn: {text: "(Nicht erlauben|Don.t Allow)", optional: true}
- extendedWaitUntil: {visible: "Get started", timeout: 30000}
- waitForAnimationToEnd
# A tap right after a cold start can land before the JS is ready.
- repeat:
    times: 4
    while:
      notVisible: "Who's traveling?"
    commands:
      - tapOn: "Get started"
      - extendedWaitUntil: {visible: "Who's traveling?", timeout: 4000, optional: true}

# ── Profile: a face from the row, a name ───────────────────────────
- tapOn: {text: "Use this face", index: 2}
- tapOn: "Your name"
- inputText: "Maestro Test"
- tapOn: "Who's traveling?"
- tapOn: "Continue"

# Race through the rest; the structural assertions live in 02-onboarding-funnel.
- extendedWaitUntil: {visible: "Where's home?", timeout: 8000}
- tapOn: "Search countries..."
- runFlow: 00-dismiss-system-dialogs.yaml
- inputText: "Germany"
- extendedWaitUntil: {visible: "Germany, .*", timeout: 5000}
- tapOn: "Germany, .*"
# Option cards read out title and description together.
- extendedWaitUntil: {visible: "What brings you here?", timeout: 8000}
- tapOn: ".*Avoid tax residency traps.*"
- extendedWaitUntil: {visible: "Fixed residence?", timeout: 5000}
- tapOn: ".*No, I.m fully nomadic.*"
- extendedWaitUntil: {visible: "Track your journey", timeout: 5000}
- tapOn: ".*I.ll set this up later.*"
- extendedWaitUntil: {visible: "Create account", timeout: 12000}

# ── Sign up with a fresh email ─────────────────────────────────────
- tapOn: {text: "Email", index: 0}
- inputText: ${TEST_EMAIL}
- tapOn: "Sign up to start your journey"
- tapOn: "Password.*"
# iOS offers a strong password in a sheet; close it and type our own.
- extendedWaitUntil: {visible: "(Starkes Passwort|Use Strong Password).*", timeout: 3000, optional: true}
- tapOn: {point: "91%,58%", optional: true}
- tapOn: "Password.*"
- inputText: ${TEST_PASSWORD}
- tapOn: "Sign up to start your journey"
- tapOn: {text: "Create account", index: 1}  # 0 is the title, 1 is the submit button

# ── Paywall, with a way out ────────────────────────────────────────
- extendedWaitUntil: {notVisible: "Create account", timeout: 20000}
- extendedWaitUntil: {visible: "(Später|Not Now)", timeout: 8000, optional: true}
- tapOn: {text: "(Später|Not Now)", optional: true}
- extendedWaitUntil: {visible: "Account", timeout: 10000}
- tapOn: "Account"
- extendedWaitUntil: {visible: "Delete Account", timeout: 5000}
- tapOn: "Delete Account"
- extendedWaitUntil: {visible: "Cancel", timeout: 5000}
- tapOn: {text: "Delete Account", index: 1}
# Deleted: back to the start, not to sign-up.
- extendedWaitUntil: {visible: "(Get started|Nicht erlauben|Don.t Allow)", timeout: 30000}
